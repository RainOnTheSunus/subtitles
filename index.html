<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Субтитры</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #17212b);
    --card: var(--tg-theme-secondary-bg-color, #232e3c);
    --text: var(--tg-theme-text-color, #fff);
    --hint: var(--tg-theme-hint-color, #8b9aa9);
    --acc: var(--tg-theme-button-color, #2f8fed);
    --sep: rgba(128,140,155,.22);
    --chip: rgba(128,140,155,.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);padding:0 0 84px;
       font:15px/1.3 -apple-system,"SF Pro Text","Helvetica Neue",Roboto,sans-serif}
  h1{margin:0;font-size:17px;font-weight:600;padding:16px 14px 2px}
  .sub{margin:0;padding:0 14px;color:var(--hint);font-size:12px}
  .cap{margin:16px 14px 5px;color:var(--hint);font-size:12px}
  .card{margin:0 14px;background:var(--card);border-radius:11px;overflow:hidden}
  input{width:100%;border:0;outline:0;background:transparent;color:var(--text);
        font:15px/1.3 inherit;padding:12px 13px}
  input::placeholder{color:var(--hint)}
  .note{margin:8px 14px 0;color:var(--hint);font-size:12px;line-height:1.4}
  .btn{margin:16px 14px 0;border:0;width:calc(100% - 28px);border-radius:10px;padding:13px;
       background:var(--acc);color:#fff;font:600 15px/1 inherit}
  .btn[disabled]{opacity:.45}
  .tools{display:flex;gap:6px;padding:0 14px 8px;flex-wrap:wrap}
  .tools button{border:0;padding:7px 12px;border-radius:8px;background:var(--chip);
                color:var(--hint);font:12px/1 inherit}
  .tools button.on{background:var(--acc);color:#fff;font-weight:600}
  .it{display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--sep)}
  .it:last-child{border-bottom:none}
  .it img{width:76px;height:43px;border-radius:6px;object-fit:cover;flex:none;background:#000}
  .meta{flex:1;min-width:0}
  .nm{font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;
      -webkit-box-orient:vertical;overflow:hidden}
  .dt{color:var(--hint);font-size:11px;margin-top:3px}
  .ck{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--hint);flex:none}
  .ck.on{background:var(--acc);border-color:var(--acc);position:relative}
  .ck.on::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;
      border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .seg{display:flex;gap:6px;padding:10px 11px}
  .seg button{flex:1;border:0;padding:8px 0;border-radius:8px;background:var(--chip);
              color:var(--hint);font:13px/1 inherit}
  .seg button.on{background:var(--acc);color:#fff;font-weight:600}
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);
       padding:8px 0 max(16px, env(safe-area-inset-bottom))}
  .err{margin:14px;padding:12px 13px;border-radius:10px;background:rgba(255,69,58,.15);
       color:#ff6b60;font-size:13px}
  .spin{margin:28px auto;width:26px;height:26px;border:2.5px solid var(--chip);
        border-top-color:var(--acc);border-radius:50%;animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  .bar2{margin:0 24px;height:10px;border-radius:5px;background:var(--chip);overflow:hidden}
  .bar2 i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s}
  .mid{text-align:center;padding:20px}
  .fill{display:flex;flex-direction:column;justify-content:center;align-items:stretch;
        min-height:calc(100dvh - 96px)}
  .mid .big{font-size:52px;font-weight:700;line-height:1.05;letter-spacing:-1px}
  .mid .cap2{margin-top:8px;color:var(--hint);font-size:14px}
  .mid .tick{font-size:44px;color:#3fb950;line-height:1}
  .nowpic{display:block;margin:20px auto 0;width:200px;max-width:70%;aspect-ratio:16/9;
          object-fit:cover;border-radius:10px;background:var(--chip)}
  .fails{margin:26px 14px 0}
  .fails .h{color:var(--hint);font-size:12px;margin:0 0 6px 2px}
  .fails .card{padding:0}
  .card.list{padding:0}
  .card .row{display:flex;align-items:center;gap:12px;padding:13px 14px;
             border-bottom:1px solid var(--sep)}
  .card .row:last-child{border-bottom:none}
  .card .txt{flex:1;min-width:0}
  .card .t1{font-size:14px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .t2{color:var(--hint);font-size:12px;margin-top:3px}
  .card .arw{color:var(--hint);font-size:19px;line-height:1;opacity:.6}
  .card.link .row{padding:14px}
  .card.link span:first-child{font-size:14px;flex:1}
  .hide{display:none}
</style>

<div id="app"></div>
<div class="bar hide" id="bar"><button class="btn" id="go"></button></div>

<script>
const KEY = "AIzaSyCbyV0XHj7wqp2-Ls7iuHrSfDFWCpKQHaU";
const VER = "v7";
const API = new URLSearchParams(location.search).get("api") || "";
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();

const app = document.getElementById("app");
const bar = document.getElementById("bar");
const go  = document.getElementById("go");

let videos = [];          // [{id,title,date}]
let picked = new Set();
let lang = "auto";
let filter = "";
let kind = "video";   // video | short | stream | all
let sourceName = "";  // канал или название видео — им назовём файл
let shown = 200;      // сколько строк нарисовано: телефон не тянет тысячи разом

const KINDS = [["all","Все"],["video","Видео"],["short","Shorts"],["stream","Трансляции"]];

const esc = s => String(s).replace(/[<>&]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
const show = html => { app.innerHTML = html; };
function setBack(on){
  const b = tg?.BackButton;
  if (!b) return;
  on ? b.show() : b.hide();
}
tg?.BackButton?.onClick(() => screenStart());

const setBar = (text, on) => {
  bar.classList.toggle("hide", !text);
  go.textContent = text || "";
  go.disabled = !on;
};

// ── Разбор ссылки ────────────────────────────────────────────────
function videoIds(text){
  const re = /(?:youtube\.com\/(?:watch\?v=|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/g;
  const out = []; let m;
  while ((m = re.exec(text))) if (!out.includes(m[1])) out.push(m[1]);
  return out;
}
function channelRef(text){
  let m = text.match(/youtube\.com\/@([^/\s?#]+)/); if (m) return {handle: m[1]};
  m = text.match(/youtube\.com\/channel\/([^/\s?#]+)/); if (m) return {id: m[1]};
  return null;
}

// ── Запросы к YouTube ────────────────────────────────────────────
async function api(path, params){
  const q = new URLSearchParams({...params, key: KEY});
  const r = await fetch(`https://www.googleapis.com/youtube/v3/${path}?${q}`);
  const j = await r.json();
  if (j.error) throw new Error(j.error.message || "YouTube отказал");
  return j;
}
async function loadChannel(ref){
  const p = ref.handle ? {forHandle: ref.handle} : {id: ref.id};
  const ch = await api("channels", {part: "contentDetails,snippet", ...p});
  if (!ch.items?.length) throw new Error("Канал не найден");
  const name = ch.items[0].snippet.title;
  const uploads = ch.items[0].contentDetails.relatedPlaylists.uploads;
  const all = []; let page = "";
  // 100 страниц по 50 — до 5000 видео. По квоте дёшево: 50 видео стоят
  // 2 единицы из 10 000 в сутки, то есть 5000 видео — 200 единиц.
  for (let i = 0; i < 100; i++){
    const r = await api("playlistItems", {part: "snippet", playlistId: uploads,
                                          maxResults: 50, pageToken: page});
    for (const it of r.items || []){
      const s = it.snippet;
      if (!s.resourceId?.videoId) continue;
      all.push({id: s.resourceId.videoId, title: s.title,
                date: (s.publishedAt || "").slice(0,10).split("-").reverse().join(".")});
    }
    page = r.nextPageToken; if (!page) break;
  }
  await addKinds(all);
  sourceName = name;
  return {name, videos: all};
}
// Тип (видео / shorts / трансляция) в списке плейлиста не приходит —
// добираем его пачками по 50, это дёшево по квоте.
async function addKinds(list){
  for (let i = 0; i < list.length; i += 50){
    const part = list.slice(i, i + 50);
    const r = await api("videos", {part: "contentDetails,liveStreamingDetails",
                                   id: part.map(v => v.id).join(",")});
    const by = {};
    for (const it of r.items || []) by[it.id] = it;
    for (const v of part){
      const it = by[v.id];
      const sec = iso2sec(it?.contentDetails?.duration || "");
      v.kind = it?.liveStreamingDetails ? "stream" : (sec && sec <= 180 ? "short" : "video");
      v.len  = sec ? fmtLen(sec) : "";
    }
  }
}
function iso2sec(d){
  const m = d.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  return m ? (+m[1]||0)*3600 + (+m[2]||0)*60 + (+m[3]||0) : 0;
}
function fmtLen(s){
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return h ? `${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`
           : `${m}:${String(x).padStart(2,"0")}`;
}

async function loadVideos(ids){
  const r = await api("videos", {part: "snippet", id: ids.join(",")});
  return (r.items || []).map(it => ({
    id: it.id, title: it.snippet.title,
    date: (it.snippet.publishedAt || "").slice(0,10).split("-").reverse().join(".")
  }));
}

// ── Экраны ───────────────────────────────────────────────────────
function screenStart(){
  setBar("", false); setBack(false);
  picked = new Set(); videos = []; filter = ""; kind = "video"; sourceName = ""; shown = 200;
  show(`<h1>Субтитры</h1>
    <div class="card"><input id="url" placeholder="Ссылка на видео или канал"
      autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <button class="btn" id="next">Дальше</button>
    <div class="card link" id="hist" style="margin-top:22px">
      <div class="row"><span>История выгрузок</span><span class="arw">›</span></div>
    </div>
    <p class="note" style="text-align:center;margin-top:18px;opacity:.5">
      ${VER}${API ? "" : " · бот недоступен"}</p>`);
  const url = document.getElementById("url");
  document.getElementById("next").onclick = () => handle(url.value.trim());
  document.getElementById("hist").onclick = screenHistory;
  url.addEventListener("keydown", e => { if (e.key === "Enter") handle(url.value.trim()); });
}

function human(n){
  return n > 1048576 ? (n/1048576).toFixed(1) + " МБ" : Math.max(1, Math.round(n/1024)) + " КБ";
}

async function screenHistory(){
  setBar("", false); setBack(true);
  show(`<h1>История</h1><div class="spin"></div>`);
  let items = [];
  try {
    if (!API) throw new Error("нет связи");
    items = (await (await fetch(`${API}/history`)).json()).items || [];
  } catch(e){
    return screenError("Бот не отвечает.\n\nАдрес меняется при каждом запуске компьютера. "
      + "Закройте окно, отправьте боту /start и откройте кнопкой из нового сообщения.");
  }
  if (!items.length){
    return show(`<h1>История</h1>
      <div class="card list"><div class="row"><div class="txt">
        <div class="t2">Пока пусто</div></div></div></div>`);
  }
  setBar("", false);
  show(`<h1>История</h1>
    <div class="card list" id="hlist">${items.map(r => `<div class="row" data-id="${esc(r.id)}" data-name="${esc(r.name)}">
      <div class="txt"><div class="t1">${esc(r.name)}</div>
        <div class="t2">${esc(r.date)} · ${r.videos} видео · ${human(r.size)}</div></div>
      <span class="arw">›</span>
    </div>`).join("")}</div>`);
  document.getElementById("hlist").onclick = e => {
    const row = e.target.closest("[data-id]"); if (!row) return;
    const rec = items.find(x => x.id === row.dataset.id);
    if (rec) screenExport(rec);
  };
}

function screenExport(rec){
  setBack(true);
  show(`<h1>${esc(rec.name)}</h1>
    <div class="cap">Выгрузка</div>
    <div class="card list">
      <div class="row"><div class="txt"><div class="t2">Когда</div></div><span>${esc(rec.date)}</span></div>
      <div class="row"><div class="txt"><div class="t2">Видео с субтитрами</div></div><span>${rec.videos}</span></div>
      ${rec.fail ? `<div class="row"><div class="txt"><div class="t2">Без субтитров</div></div><span>${rec.fail}</span></div>` : ""}
      <div class="row"><div class="txt"><div class="t2">Размер</div></div><span>${human(rec.size)}</span></div>
    </div>
`);

  setBar("Скачать файл", true);
  go.onclick = () => {
    const url = `${API}/file?job=${rec.id}&name=${encodeURIComponent(rec.name)}`;
    tg?.HapticFeedback?.impactOccurred?.("medium");
    if (tg?.downloadFile) tg.downloadFile({url, file_name: rec.name + ".txt"});
    else if (tg?.openLink) tg.openLink(url);
    else location.href = url;
  };
}

function screenLoading(text){
  setBar("", false); setBack(true);
  show(`<h1>${esc(text)}</h1><div class="spin"></div>`);
}

function screenError(msg){
  setBar("", false); setBack(true);
  show(`<h1>Не получилось</h1><div class="err">${esc(msg)}</div>
        <button class="btn" id="back">Назад</button>`);
  document.getElementById("back").onclick = screenStart;
}

function langBlock(){
  return `<div class="cap">Язык</div>
    <div class="card"><div class="seg" id="lang">
      <button data-l="auto" class="on">Авто</button>
      <button data-l="ru">Русский</button>
      <button data-l="en">Английский</button>
    </div></div>
`;
}
function bindLang(){
  document.getElementById("lang").onclick = e => {
    const b = e.target.closest("button[data-l]"); if (!b) return;
    lang = b.dataset.l;
    [...b.parentNode.children].forEach(x => x.classList.toggle("on", x === b));
  };
}

function screenSingle(v){
  show(`<h1>Одно видео</h1>
    <div class="card"><div class="it">
      <img src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" alt="">
      <div class="meta"><div class="nm">${esc(v.title)}</div><div class="dt">${esc(v.date)}</div></div>
    </div></div>
    ${langBlock()}`);
  bindLang(); setBack(true);
  sourceName = v.title;
  videos = [v];
  picked = new Set([v.id]);
  go.onclick = startDownload;
  setBar("Скачать субтитры", true);
}

function screenList(title, sub){
  const visAll = videos.filter(v =>
    (kind === "all" || v.kind === kind) &&
    (!filter || v.title.toLowerCase().includes(filter)));
  const vis = visAll.slice(0, shown);
  const rows = vis.map(v => `<div class="it" data-id="${v.id}">
      <img src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" alt="" loading="lazy">
      <div class="meta"><div class="nm">${esc(v.title)}</div>
        <div class="dt">${esc(v.date)}${v.len ? " · " + v.len : ""}</div></div>
      <div class="ck ${picked.has(v.id) ? "on" : ""}"></div>
    </div>`).join("") || `<div class="it"><div class="meta"><div class="dt">Ничего не нашлось</div></div></div>`;

  show(`<h1>${esc(title)}</h1><p class="sub">${esc(sub)}</p>
    <div class="card"><input id="q" placeholder="Поиск" value="${esc(filter)}"
      autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="cap" id="cnt">${(() => {
      const here = visAll.filter(v => picked.has(v.id)).length;
      return picked.size > here
        ? `Выбрано: ${picked.size} · на этой вкладке ${here}`
        : `Выбрано: ${picked.size}`;
    })()}</div>
    <div class="tools" id="kinds">
      ${KINDS.map(k => `<button data-k="${k[0]}" class="${kind === k[0] ? "on" : ""}">${k[1]}${
        k[0] === "all" ? "" : ` ${videos.filter(v => v.kind === k[0]).length}`}</button>`).join("")}
    </div>
    <div class="tools">
      <button id="all">Выбрать все</button>
      <button id="none">Снять всё</button>
    </div>
    <div class="card" id="list">${rows}</div>
    ${visAll.length > vis.length
      ? `<button class="btn" id="more" style="background:var(--chip);color:var(--hint)">Показать ещё · осталось ${visAll.length - vis.length}</button>`
      : ""}`);

  const q = document.getElementById("q");
  q.oninput = () => { filter = q.value.trim().toLowerCase(); shown = 200; screenList(title, sub);
                      const n = document.getElementById("q"); n.focus();
                      n.setSelectionRange(n.value.length, n.value.length); };
  document.getElementById("kinds")?.addEventListener("click", e => {
    const b = e.target.closest("button[data-k]"); if (!b) return;
    kind = b.dataset.k; shown = 200; screenList(title, sub);
  });
  document.getElementById("more")?.addEventListener("click", () => { shown += 200; screenList(title, sub); });
  // «Выбрать все» берёт весь найденный список, а не только нарисованную часть.
  document.getElementById("all").onclick  = () => { visAll.forEach(v => picked.add(v.id)); screenList(title, sub); };
  document.getElementById("none").onclick = () => { picked.clear(); screenList(title, sub); };
  document.getElementById("list").onclick = e => {
    const row = e.target.closest(".it[data-id]"); if (!row) return;
    const id = row.dataset.id;
    picked.has(id) ? picked.delete(id) : picked.add(id);
    row.querySelector(".ck").classList.toggle("on", picked.has(id));
    const here = vis.filter(v => picked.has(v.id)).length;
    document.getElementById("cnt").textContent = picked.size > here
      ? `Выбрано: ${picked.size} · на этой вкладке ${here}`
      : `Выбрано: ${picked.size}`;
    setBar(`Скачать субтитры · ${picked.size}`, picked.size > 0);
    tg?.HapticFeedback?.selectionChanged?.();
  };
  go.onclick = startDownload;
  setBar(`Скачать субтитры · ${picked.size}`, picked.size > 0);
  setBack(true);
}

// ── Разбор того, что вставили ────────────────────────────────────
async function handle(text){
  if (!text) return;
  const ids = videoIds(text);
  const ch = channelRef(text);
  try {
    if (ids.length === 1 && !ch){
      screenLoading("Читаю видео…");
      const v = (await loadVideos(ids))[0];
      if (!v) throw new Error("Видео не найдено");
      screenSingle(v);
    } else if (ids.length > 1){
      screenLoading("Читаю видео…");
      videos = await loadVideos(ids);
      sourceName = `${videos.length} видео`;
      picked = new Set(videos.map(v => v.id));
      screenList("Ваши ссылки", `${videos.length} видео`);
    } else if (ch){
      screenLoading("Читаю канал…");
      const r = await loadChannel(ch);
      videos = r.videos; picked = new Set();
      screenList("Выберите видео", `${r.name} · ${videos.length} видео`);
    } else {
      screenError("Это не похоже на ссылку с YouTube. Нужна ссылка на видео или на канал.");
    }
  } catch(e){
    screenError(e.message || String(e));
  }
}

// ── Отправка боту ────────────────────────────────────────────────
function startDownload(){
  const chosen = videos.filter(v => picked.has(v.id));
  const list = chosen.length ? chosen : [...picked].map(id => ({id, title: id}));
  if (!list.length) return;
  tg?.HapticFeedback?.impactOccurred?.("medium");
  if (API) return runJob(list);
  // Запасной путь: бот недоступен — отдаём выбор через Telegram и закрываемся.
  if (tg?.sendData) tg.sendData(JSON.stringify({v: 1, lang, ids: list.map(v => v.id).slice(0, 330)}));
  else screenError("Бот сейчас недоступен. Похоже, компьютер выключен.");
}
go.onclick = startDownload;

// ── Работа через бота: окно остаётся открытым ────────────────────
let jobId = null, poller = null;

function screenProgress(st){
  const pct = st.total ? Math.round(st.done / st.total * 100) : 0;
  setBar("", false); setBack(false);
  show(`<div class="fill"><div class="mid">
      <div class="big">${st.done}<span style="color:var(--hint)">/${st.total}</span></div>
      <div class="cap2">проверено${st.fail ? ` · с субтитрами ${st.ok} · без ${st.fail}` : `, все с субтитрами`}</div>
      ${st.now_id ? `<img class="nowpic" src="https://i.ytimg.com/vi/${esc(st.now_id)}/mqdefault.jpg" alt="">` : ""}
      ${st.now ? `<div class="cap2" style="margin-top:${st.now_id ? 8 : 12}px;opacity:.8">${esc(st.now)}</div>` : ""}
    </div>
    <div style="height:26px"></div>
    <div class="bar2"><i style="width:${pct}%"></i></div>
    <button class="btn" id="stop" style="background:var(--chip);color:var(--hint)">Остановить</button>
    </div>`);
  document.getElementById("stop").onclick = async () => {
    try { await fetch(`${API}/stop?job=${jobId}`); } catch(e){}
  };
}

function screenDone(st){
  setBack(true);
  const word = n => {
    const a = n % 10, b = n % 100;
    return (a === 1 && b !== 11) ? "видео" : "видео";
  };
  show(`<div class="${st.no_subs?.length ? "" : "fill"}"><div class="mid">
      <div class="tick">✓</div>
      <div class="big" style="margin-top:10px">${st.ok}</div>
      <div class="cap2">${word(st.ok)} с субтитрами${st.fail ? ` · не вышло ${st.fail}` : ""}</div>
    </div>
    ${st.no_subs?.length ? `<div class="fails">
      <p class="h">Без субтитров${st.fail > st.no_subs.length ? ` (первые ${st.no_subs.length} из ${st.fail})` : ""}</p>
      <div class="card">${st.no_subs.map(v => `<div class="it">
        <img src="https://i.ytimg.com/vi/${esc(v.id || v)}/mqdefault.jpg" alt="" loading="lazy">
        <div class="meta"><div class="nm">${esc(v.title || v)}</div></div>
      </div>`).join("")}</div>
    </div>` : ""}</div>`);
  setBar("Забрать субтитры", st.ok > 0);
  go.onclick = () => {
    const url = `${API}/file?job=${jobId}&name=${encodeURIComponent(fileName())}`;
    if (tg?.downloadFile) tg.downloadFile({url, file_name: fileName() + ".txt"});
    else if (tg?.openLink) tg.openLink(url);
    else location.href = url;
  };
}

function fileName(){
  // Windows и Mac не любят эти символы в именах файлов.
  const clean = (sourceName || "субтитры").replace(/[\\/:*?"<>|]/g, " ")
                  .replace(/\s+/g, " ").trim().slice(0, 50);
  return clean || "субтитры";
}

async function runJob(list){
  screenProgress({done: 0, total: list.length, ok: 0, fail: 0});
  try {
    const r = await fetch(`${API}/start`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({lang, name: fileName(), videos: list.map(v => ({id: v.id, title: v.title}))}),
    });
    const j = await r.json();
    if (!j.job) throw new Error(j.error || "бот не принял задачу");
    jobId = j.job;
  } catch(e){
    return screenError("Не достучался до бота. Закройте окно, отправьте боту /start и откройте заново — адрес мог смениться.");
  }
  clearInterval(poller);
  poller = setInterval(async () => {
    try {
      const st = await (await fetch(`${API}/status?job=${jobId}`)).json();
      if (st.error) throw new Error(st.error);
      st.ready ? (clearInterval(poller), screenDone(st)) : screenProgress(st);
    } catch(e){
      clearInterval(poller);
      screenError("Связь с ботом оборвалась. Файл мог остаться у бота — попробуйте ещё раз.");
    }
  }, 1500);
}

screenStart();
</script>
